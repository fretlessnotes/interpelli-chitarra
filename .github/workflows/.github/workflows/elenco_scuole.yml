name: Aggiorna elenco scuole

on:
  schedule:
    - cron: "15 3 * * 1"   # ogni lunedì alle 3:15 (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawler
  cancel-in-progress: false

jobs:
  elenco:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Le regioni si cambiano qui (nomi senza spazi né apostrofi: VALLE-D-AOSTA, EMILIA-ROMAGNA, ...)
      - run: python costruisci_elenco_scuole.py --regioni PIEMONTE LOMBARDIA LIGURIA VALLE-D-AOSTA EMILIA-ROMAGNA VENETO TOSCANA UMBRIA
      - run: |
          git config user.name "crawler-interpelli"
          git config user.email "crawler@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "elenco scuole aggiornato"
          git pull --rebase || true
          git push || true
